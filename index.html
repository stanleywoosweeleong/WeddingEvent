<style>
/* Layout: phone app shell. Sticky header, one column (max 40rem), fixed bottom tab bar.
   Palette: jade ink on porcelain, one red seal (囍) used only for the couple and for "Now". */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --ink:#0F221D; --ink2:#243832; --line:#C3CFC9;
  --jade:#1B5A4A; --jade-bg:#E0ECE7; --on-jade:#FFFFFF;
  --seal:#B42318; --seal-bg:#FCE9E6; --on-seal:#FFFFFF;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,"Songti SC","Noto Serif SC",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-cjk:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --fs:17px; --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1512; --surface:#14201C; --ink:#EEF4F1; --ink2:#CAD6D1; --line:#33443E;
  --jade:#8BCFB8; --jade-bg:#1B2F29; --on-jade:#0C1512;
  --seal:#F2796D; --seal-bg:#3B1B18; --on-seal:#1A0B09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#14201C; --ink:#EEF4F1; --ink2:#CAD6D1; --line:#33443E;
  --jade:#8BCFB8; --jade-bg:#1B2F29; --on-jade:#0C1512;
  --seal:#F2796D; --seal-bg:#3B1B18; --on-seal:#1A0B09; color-scheme:dark}

html{font-size:var(--fs)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:40rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.seal{flex:none;display:grid;place-items:center;width:40px;height:40px;background:var(--seal);color:var(--on-seal);font-family:var(--f-cjk);font-size:25px;line-height:1;border-radius:3px}
.brand{flex:1;min-width:0;display:grid;line-height:1.2}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .b1{font-family:var(--f-cjk);font-size:19px;font-weight:700;letter-spacing:.04em}
.brand .b2{font-family:var(--f-display);font-size:17px}
.hbtn{flex:none;min-width:48px;height:44px;padding:0 10px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700;font-size:17px}
.hbtn .aa-s{font-size:.75em}

main{max-width:40rem;margin:0 auto;padding:.9rem 16px 7rem}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:40rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:.5rem .25rem .55rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.85rem;font-weight:600;color:var(--ink2)}
.nav svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--jade)}
.nav button[aria-current="page"] span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em}

/* shared controls */
.lbl{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg>button{flex:1 1 max-content;min-width:0}
.seg button,.chip,.btn{min-height:3rem;padding:.4rem .75rem;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:600;line-height:1.25}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:2.6rem;font-size:.95rem}
.controls{display:grid;gap:.7rem;padding:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:1.25rem}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.btn{font-size:1rem}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}

/* home */
.hero{margin:0 0 .75rem;font-size:1rem;font-weight:700;color:var(--jade);letter-spacing:.02em;line-height:1.35}
.hero .dot{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:grid;gap:.35rem}
.stack{display:grid;gap:.75rem;margin-bottom:1.25rem}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.35rem}
.count div{text-align:center;padding:.55rem .25rem;background:var(--jade-bg);border-radius:var(--r)}
.count b{display:block;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--jade)}
.count span{font-size:.9rem}
.now-card{border:2px solid var(--seal);background:var(--seal-bg)}
.badge{justify-self:start;display:inline-block;padding:.1rem .5rem;border-radius:3px;background:var(--seal);color:var(--on-seal);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge.soft{background:var(--jade-bg);color:var(--jade)}
.big-t{font-size:1.3rem;font-weight:700;line-height:1.3}
.muted{color:var(--ink2)}
.day{margin:0 0 1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day .dh{padding:.5rem 1rem;background:var(--jade);color:var(--on-jade);font-weight:700;letter-spacing:.04em}
.day .dr{display:grid;grid-template-columns:min(6.3rem,34%) minmax(0,1fr);overflow-wrap:anywhere;gap:.7rem;padding:.6rem 1rem;border-top:1px solid var(--line);cursor:pointer;scroll-margin-top:5rem}
.day .dh+.dr{border-top:0}
.day .dr:focus-visible{outline:3px solid var(--jade);outline-offset:-3px}
.day .dr.now{background:var(--seal-bg);box-shadow:inset 0 0 0 2px var(--seal)}
.day .t{font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums;line-height:1.4}
.day .tbc{display:block;font-size:.85rem;color:var(--seal)}
.day .d{display:grid;gap:.1rem;min-width:0;line-height:1.4}
.day .d .badge{margin-bottom:.15rem}
.day .dl{color:var(--jade);font-weight:600}
.day .dw{font-size:.92rem}
.day .dn{margin-top:.2rem;padding:.35rem .55rem;border:2px solid var(--jade);background:var(--jade-bg);border-radius:var(--r);font-size:.95rem}

/* Preview any moment of the day: open the page with #t0930 (= 3 Oct 2026, 9:30 AM Malaysia time) */
let offset=0;
(function parseHash(){
  const h=location.hash.slice(1).toLowerCase(); const m=/^t(\d{2})(\d{2})$/.exec(h);
  if(m){offset=Date.UTC(2026,9,3,+m[1]-8,+m[2])-Date.now();}
  else if(h==="programme"||h==="prog") tab="prog";
  else if(h==="tables"||h==="seat") tab="seat";
  else if(h==="service"||h==="svc") tab="svc";
  else if(h==="crew"){tab="prog";view="crew";}
})();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const u=()=>UI[lang];
const tr=o=>o?(lang==="zht"?T(o.zh):(o[lang]??o.en)):"";
const whoName=w=>WHO[w]?tr(WHO[w]):w;
const toM=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};

function fmtTime(s){
  let [h,m]=s.split(":").map(Number); const mm=String(m).padStart(2,"0"); const h12=((h+11)%12)+1;
  if(lang==="zh"||lang==="zht"){const p=h<12?"上午":h===12?"中午":h<19?"下午":"晚上";return `${p}${h12}:${mm}`}
  if(lang==="ms"){const p=h<12?"pagi":h<14?"tengah hari":h<19?"petang":"malam";return `${h12}.${mm} ${p}`}
  return `${h12}:${mm} ${h<12?"AM":"PM"}`;
}
function klNow(){const d=new Date(Date.now()+offset+8*3600e3);return{key:d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate(),mins:d.getUTCHours()*60+d.getUTCMinutes()}}
function phase(){const n=klNow();return{p:n.key<20261003?"before":n.key>20261003?"after":"day",mins:n.mins}}

/* status of each item: past / now / up */
function statuses(list,end){
  const ph=phase();
  if(ph.p==="after") return list.map(()=>"past");
  if(ph.p==="before") return list.map(()=>"up");
  const E=toM(end);
  return list.map((it,i)=>{const s=toM(it.t);let e=E;for(let j=i+1;j<list.length;j++){const sj=toM(list[j].t);if(sj>s){e=sj;break}}
    return ph.mins>=e?"past":ph.mins>=s?"now":"up"});
}

/* ================= VIEWS ================= */
function segLabels(){const t=u();return{morn:t.segMorn,cer:t.segCer,aft:t.segAft,din:t.segDin}}
function clashText(){
  const t=u(), lbl=segLabels(), lines=[`*${t.waTitle}*`,""]; let n=1;
  SEG_ORDER.forEach(k=>{
    if(SEGS[k].clash){lines.push(`*${n++}. ${lbl[k]} · ${t.gCer} (${fmtTime(CER_START)})*`,tr(SEGS[k].clash),"")}
    SEGS[k].list.forEach(it=>{if(it.clash)lines.push(`*${n++}. ${lbl[k]} · ${tr(it.ti)} (${fmtTime(it.t)})*`,tr(it.clash),"")});
  });
  lines.push(t.waAsk); return lines.join("\n");
}
function copyText(s,btn){
  const done=()=>{const t=u(),old=btn.textContent;btn.textContent="✓ "+t.copied;setTimeout(()=>{btn.textContent=old},2000)};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=s;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(s).then(done,fallback)}catch(e){fallback()}
}
function clashBox(c){const t=u();return `<div class="clash"><span class="clash-l">⚠ ${t.clashLbl}</span>${esc(tr(c))}</div>`}
function itemCard(it,st,crewMode,filterWho,allCrew,segTag){
  const t=u();
  let cues=it.cues||[];
  if(crewMode&&filterWho&&!(it.who||[]).includes(filterWho)) cues=cues.filter(c=>(c.who||[]).includes(filterWho));
  const songs=it.songs?`<p class="songs"><span class="lbl">${t.music}</span>${it.songs.map(s=>esc(lang==="zht"?T(s):s)).join(" · ")}</p>`:"";
  const sub=!crewMode&&it.sub?`<p class="muted">${esc(tr(it.sub))}</p>`:"";
  const pic=crewMode&&it.who&&it.who.length?`<p class="pic"><span class="lbl">${t.inCharge}</span><span class="who">${it.who.map(w=>esc(whoName(w))).join(", ")}</span></p>`:"";
  const cueList=crewMode&&cues.length?`<ul class="cues">${cues.map(c=>`<li>${esc(tr(c.x))}${c.who&&c.who.length?` <span class="who">· ${c.who.map(w=>esc(whoName(w))).join(", ")}</span>`:""}</li>`).join("")}</ul>`:"";
  return `<li class="it ${st}${it.crew?" crew-only":""}">
    <div class="tm">${fmtTime(it.t)}${st==="past"?`<span class="done">✓ ${t.done}</span>`:""}</div>
    <div class="bd">${segTag?`<span class="tag">${esc(segTag)}</span>`:""}${st==="now"?`<span class="badge">${t.now}</span>`:""}${crewMode&&it.crew&&!allCrew?`<span class="tag">${t.crewOnly}</span>`:""}
      <h3>${esc(tr(it.ti))}</h3>${it.loc?`<p class="loc">${esc(tr(it.loc))}</p>`:""}${sub}${songs}${pic}${cueList}${crewMode&&it.clash?clashBox(it.clash):""}</div></li>`;
}

function viewHome(){
  const t=u(), ph=phase();
  let status="";
  const [csH,csM]=CER_START.split(":").map(Number); const target=Date.UTC(2026,9,3,csH-8,csM); const diff=target-(Date.now()+offset);
  if(diff>0){
    const D=Math.floor(diff/864e5),H=Math.floor(diff%864e5/36e5),M=Math.floor(diff%36e5/6e4);
    status+=`<div class="card"><span class="lbl">${t.begins}</span>
      <div class="count"><div><b>${D}</b><span>${t.d}</span></div><div><b>${H}</b><span>${t.h}</span></div><div><b>${M}</b><span>${t.m}</span></div></div></div>`;
  }
  if(ph.p==="after"||(ph.p==="day"&&ph.mins>=toM(DIN_END))) status=`<div class="card now-card"><p class="big-t">${t.thanks}</p><p class="muted">${t.thanksSub}</p></div>`;

  return `<h1 class="hero">${t.date}</h1>
    <div class="stack"><div class="btn-row"><button class="btn primary" type="button" data-go="seat">${t.findBtn}</button><button class="btn" type="button" data-go="prog">${t.progBtn}</button></div></div>

    <ol class="day">${dayRows()}</ol>
    ${venueCards()}
    ${status?`<div class="stack">${status}</div>`:""}${offlineNote()}`;
}

function dayRows(){
  const t=u(), lbl=segLabels(), out=[];
  SEG_ORDER.forEach(k=>{
    const g=segData(k,true), st=statuses(g.list,g.end), rows=g.list.map((x,i)=>({x,s:st[i]}));
    if(k==="cer") rows.push({x:{t:CER_START,ti:L(UI.en.gCer,UI.zh.gCer,UI.ms.gCer),note:SEGS.cer.note,clash:SEGS.cer.clash},s:""});
    rows.sort((a,b)=>toM(a.x.t)-toM(b.x.t));
    out.push(`<li class="dh">${esc(lbl[k])}</li>`);
    rows.forEach(({x,s})=>{
      const who=(x.who||[]).map(whoName).join(", ");
      out.push(`<li class="dr ${s}" data-goseg="${k}" tabindex="0">
        <span class="t">${fmtTime(x.t)}${x.clash?`<span class="tbc">⚠ ${t.tbc}</span>`:""}</span>
        <span class="d">${s==="now"?`<span class="badge">${t.now}</span> `:""}<b>${esc(tr(x.ti))}</b>${x.loc?`<span class="dl">${esc(tr(x.loc))}</span>`:""}${who?`<span class="dw">${esc(who)}</span>`:""}${x.note?`<span class="dn">${esc(tr(x.note))}</span>`:""}</span></li>`);
    });
  });
  return out.join("");
}

function venueText(list){
  const t=u(), lines=[`*${t.waVenTitle}*`,""];
  list.forEach(v=>{lines.push(`*${fmtTime(v.t)} · ${v.k==="cer"?t.venCer:t.venDin}*`,...venueNames(v),...v.addr,"Google Maps: "+gmapsUrl(v),"Waze: "+wazeUrl(v),"")});
  if(/github\.io$/.test(location.hostname)) lines.push(`${t.waApp}: ${location.origin}${location.pathname}`);
  return lines.join("\n").trim();
}

function offlineNote(){
  const t=u(); const lines=[];
  if(!navigator.onLine) lines.push(`<p class="off-warn">${t.offNow}</p>`);
  else if(offlineReady) lines.push(`<p class="off-ok">✓ ${t.offReady}</p>`);
  lines.push(`<p class="muted">${t.asOf}</p>`);
  return `<div class="offline">${lines.join("")}</div>`;
}

  const t=u(); const crewMode=view==="crew";
  const avail=segsFor(crewMode);
  if(!avail.includes(day)) day="cer";
  if(pickSeg){pickSeg=false;if(phase().p==="day"){let best=-1;avail.forEach(k=>{const g=segData(k,crewMode);statuses(g.list,g.end).forEach((s,i)=>{if(s==="now"&&toM(g.list[i].t)>best){best=toM(g.list[i].t);day=k}})})}}

    });
    return `<div class="controls">
      <div class="seg" role="group"><button type="button" data-view="crew" aria-pressed="true">${t.crew}</button><button type="button" data-view="guest" aria-pressed="false">${t.guest}</button></div>
      <div class="seg" role="group">${avail.map(k=>`<button type="button" data-day="${k}" aria-pressed="false">${segLbl[k]}</button>`).join("")}</div>
      ${clashBtn}
      <div class="btn-row"><a class="btn primary wa" href="https://wa.me/?text=${encodeURIComponent(clashText())}" target="_blank" rel="noopener">${t.shareWa}</a><button type="button" class="btn" data-copyclash="1">${t.copyTxt}</button></div>
    </div><ol class="tl">${out.join("")}</ol>`;
  }
  return `<div class="controls">
      <div class="seg" role="group"><button type="button" data-view="crew" aria-pressed="${crewMode}">${t.crew}</button><button type="button" data-view="guest" aria-pressed="${!crewMode}">${t.guest}</button></div>
      <div class="seg" role="group">${avail.map(k=>`<button type="button" data-day="${k}" aria-pressed="${day===k}">${segLbl[k]}</button>`).join("")}</div>
      ${clashBtn}
      ${chips}
    </div>${venue}
    ${rows.length?`<ol class="tl">${rows.map(r=>itemCard(r.it,r.s,crewMode,crewWho,src.every(x=>x.crew))).join("")}</ol>`:`<p class="empty">${t.noCues}</p>`}`;
}

const norm=s=>[...s].map(c=>T2S[c]||c).join("").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9㐀-鿿]+/g," ").trim();
function tableCard(tb,hits){
  const t=u(); const mainT=tb.n==="main";
  return `<article class="tcard"><header><span class="tno${mainT?" main":""}">${mainT?"囍":tb.n}</span><h3>${t.table(tb.n)}</h3></header>
    ${hits?`<span class="lbl">${t.atTable}</span>`:""}
    <ul>${tb.p.map(p=>`<li>${hits&&hits.includes(p)?`<mark>${esc(p)}</mark>`:esc(p)}</li>`).join("")}</ul></article>`;
}
function seatResults(){
  const t=u(); const q=norm(query);
  if(!q) return `<h2 class="sec-h">${t.allTables}</h2><div class="tgrid">${TABLES.map(tb=>tableCard(tb)).join("")}</div>`;
  const toks=q.split(" ").filter(Boolean);
  const out=[];
  TABLES.forEach(tb=>{
    const numHit=/^\d{1,2}$/.test(q)&&String(tb.n)===q;
    const hits=tb.p.filter(p=>{const np=norm(p),flat=np.replace(/ /g,"");return toks.every(k=>np.includes(k)||flat.includes(k))});
    if(numHit||hits.length) out.push({tb,hits});
  });
  if(!out.length) return `<p class="empty">${t.none}</p>`;
  const n=out.reduce((a,o)=>a+Math.max(o.hits.length,1),0);
  return `<p class="found" aria-live="polite">${t.found(n)}</p>${out.map(o=>`<div class="hit">${tableCard(o.tb,o.hits)}</div>`).join("")}`;
}
function viewSeat(){
  const t=u();
  return `<div class="search"><label class="lbl" for="q">${t.searchLbl}</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="words" enterkeyhint="search" value="${esc(query)}"></div>
    <div id="res">${seatResults()}</div>`;
}

/* ================= RENDER ================= */
function render(){
  const t=u();
  document.documentElement.lang={zh:"zh-Hans",zht:"zh-Hant",en:"en",ms:"ms"}[lang];
  $("#bZh").textContent=lang==="zht"?"胡瑞良 & 潘曉楠":"胡瑞良 & 潘晓楠";
  $("#langBtn").textContent=t.langBtn; $("#langBtn").setAttribute("aria-label",t.lang);
  $("#sizeBtn").setAttribute("aria-label",t.size);
  document.querySelectorAll(".nav button").forEach(b=>{b.querySelector("span").textContent=t[b.dataset.tab];b.toggleAttribute("aria-current",false);if(b.dataset.tab===tab)b.setAttribute("aria-current","page")});
  $("#main").innerHTML=tab==="home"?viewHome():tab==="svc"?viewSvc():tab==="prog"?viewProg():viewSeat();
  if(tab==="seat"){const q=$("#q");q.addEventListener("input",e=>{query=e.target.value;$("#res").innerHTML=seatResults()})}
  if((tab==="prog"||tab==="svc"||tab==="home")&&pendingScroll){pendingScroll=false;const el=document.querySelector(".it.now,.svc li.now,.day .dr.now");
    if(el){const smooth=!matchMedia("(prefers-reduced-motion: reduce)").matches;el.scrollIntoView({block:"center",behavior:smooth?"smooth":"auto"})}}
}
function setTab(x){tab=x;pendingScroll=true;if(x==="prog")pickSeg=true;window.scrollTo(0,0);render()}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.goseg)e.target.click()});
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-goseg]");
  if(r){view="crew";day=r.dataset.goseg;clashOnly=false;crewWho=null;tab="prog";pickSeg=false;pendingScroll=true;window.scrollTo(0,0);render();return}
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab) setTab(b.dataset.tab);
  else if(b.dataset.go) setTab(b.dataset.go);
  else if(b.dataset.day){day=b.dataset.day;clashOnly=false;pendingScroll=true;render()}
  else if(b.dataset.copyclash){copyText(clashText(),b)}
  else if(b.dataset.clash){clashOnly=!clashOnly;window.scrollTo(0,0);render()}
  else if(b.dataset.view){view=b.dataset.view;crewWho=null;clashOnly=false;pickSeg=true;pendingScroll=true;render()}
  else if(b.dataset.who!==undefined){crewWho=b.dataset.who||null;render()}
  else if(b.dataset.lang){lang=b.dataset.lang;STORE.set("ssw-lang",lang);$("#picker").hidden=true;render()}
  else if(b.id==="langBtn"){document.querySelectorAll(".pk-btns button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));$("#picker").hidden=false}
  else if(b.id==="sizeBtn"){sizeIx=(sizeIx+1)%SIZES.length;applySize();STORE.set("ssw-fs",SIZES[sizeIx])}
});
function applySize(){document.documentElement.style.setProperty("--fs",SIZES[sizeIx]+"px")}

applySize();
if(firstRun) $("#picker").hidden=false;
pendingScroll=true;
render();
/* Offline: when served from GitHub Pages (https), sw.js keeps a copy of the app on the phone.
   Inside the Claude artifact viewer registration is refused, and the note stays hidden. */
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;if(tab==="home")render()}).catch(()=>{});
}
addEventListener("online",()=>{if(tab==="home")render()});
addEventListener("offline",()=>{if(tab==="home")render()});

/* keep "Now" and the countdown current without jumping the page */
let lastKey="";
setInterval(()=>{const n=klNow();const k=n.key+":"+n.mins;if(k===lastKey||tab==="seat")return;lastKey=k;const y=window.scrollY;render();window.scrollTo(0,y)},15000);
</script>
